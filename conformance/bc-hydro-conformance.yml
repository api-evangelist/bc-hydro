note: >-
  Asserted from BC Hydro's own published pages and from live anonymous probes.
  BC Hydro publishes no machine-readable API contract, so nothing here is derived
  from a specification. Every entry carries its evidence; where a standard is
  simply absent from BC Hydro's surface, conforms is false rather than unknown,
  and where the artifact could not be inspected that is said plainly.
standards:
- id: green-button-download-my-data
  conforms: true
  evidence: >-
    BC Hydro's billing page (https://app.bchydro.com/accounts-billing/bill-payment/view-bill.html,
    HTTP 200, fetched 2026-07-27) states under "Electricity use history" that a
    customer can "Download a CSV or Green Button XML file with your metered
    electricity use", available through the previous day, with up to three years
    of history retained. Voluntary adoption — no regulation compels it.
  caveat: >-
    File export only, inside an authenticated MyHydro session. The XML itself
    could not be inspected because no customer account was used, and BC Hydro
    publishes no ESPI version, schema reference or conformance level.
- id: green-button-connect-my-data
  conforms: false
  evidence: >-
    No OAuth authorization surface, no third-party vendor onboarding, no
    data-recipient terms and no published resource base URI exist anywhere on
    bchydro.com. A third party cannot reach a customer's data programmatically.
- id: naesb-req21-espi
  conforms: unknown
  evidence: >-
    Green Button XML implies NAESB REQ.21 ESPI, but BC Hydro names no version and
    the file is emitted only to an authenticated customer, so the profile could
    not be verified.
- id: green-button-alliance-certification
  conforms: false
  evidence: >-
    https://www.greenbuttonalliance.org/certification (HTTP 200) describes the DMD
    and CMD testing programmes but does not name BC Hydro; the only Canadian
    organization named there is Enbridge Gas, as a Sponsor Member. BC Hydro makes
    no certification claim on its own site.
- id: oauth2
  conforms: false
  evidence: No OAuth 2.0 authorization or token endpoint is exposed to third parties.
- id: openid-connect
  conforms: false
