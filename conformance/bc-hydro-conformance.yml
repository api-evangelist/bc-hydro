    returns HTTP 200 and redirects to the /siteinfo/404.html soft-404 page; no
    discovery document is served. Customer login is a ForgeRock/OpenAM-style
    session SSO (realm=bch-ps), not an OIDC provider open to relying parties.
- id: oauth2-discovery-rfc8414
