regulatory:
- id: bcuc-rate-regulation
  name: B.C. Utilities Commission economic regulation (Utilities Commission Act)
  url: https://www.bcuc.com/
  applies: true
  obligation: >-
    Rate and tariff regulation of BC Hydro. No consumer data-sharing or open-data
    obligation attaches. Terms, conditions and pricing are published as tariffs at
    https://www.bchydro.com/toolbar/about/strategies-plans-regulatory/tariffs-terms-conditions.html
- id: bcuc-order-g-127-06
  name: BCUC Order G-127-06 transmission transaction-data postings
  url: https://www.bchydro.com/energy-in-bc/operations/transmission/transmission-scheduling/transaction-data.html
  applies: true
  obligation: >-
    Post economic test results daily and Network Economy / Non-Firm utilization
    reports weekly. Discharged as documents; no format, feed or API is disclosed.
- id: ontario-reg-633-21
  name: O. Reg. 633/21 (Energy Data), Electricity Act, 1998
  url: https://www.ontario.ca/laws/regulation/210633
  applies: false
  applies_evidence: >-
    Binds Ontario electricity and natural gas distributors only. It has no force
    in British Columbia, and neither Canada nor B.C. has enacted an equivalent.
    This is why BC Hydro's Green Button support is voluntary and file-only while
    Hydro One runs a mandated Connect My Data OAuth surface.
