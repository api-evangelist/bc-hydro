  - url: https://www.bchydro.com/energy-in-bc/operations/transmission/transmission-scheduling/oasis.html
    status: 200
    note: >-
      "allows registered users to make reservations for transmission service on
      the BC Hydro transmission system"; created per FERC requirements. Links
      out to OATI-hosted nodes.
  - url: http://www.oasis.oati.com/cwo_default.htm
    status: 000
    note: Connection failure anonymously — OASIS node not reachable without registration/client access.
  - url: https://www.bchydro.com/energy-in-bc/operations/transmission/transmission-scheduling/transaction-data.html
    status: 200
    note: >-
      Economic test results daily, Network Economy and Non-Firm utilization
      reports weekly, quarterly/annual Network Economy reports, "Pursuant to
      B.C. Utilities Commission Order Number G-127-06." Documents, not feeds.
  - url: https://www.bchydro.com/powersmart/electric-vehicles/public-charging/charging-rates-roaming.html
    status: 200
    note: >-
      Names roaming partners (Blink, ChargePoint, Electric Circuit, EV Start,
      EVCS, FLO, Hypercharge, Ivy, Plug EV, Shell Recharge, Swtch) and OEM apps
