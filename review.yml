actions:
  apisYmlUpdated: true
  openapiDirCreated: false
  reason: >-
    apis[] is deliberately EMPTY. BC Hydro documents no public API. The Green
    Button XML export is a human-initiated file download inside an
    authenticated portal, not an API; the outage JSON feed is real but wholly
    undocumented; the BC Data Catalogue WMS service is published by the
    Province, not by BC Hydro as an API product. No spec was harvested because
    none exists, so no openapi/ directory was created rather than inventing
    one.

enrichment:
  date: '2026-07-27'
  round: 2
  contractDiscovery: >-
    Re-run in full against www.bchydro.com, app.bchydro.com and api.bchydro.com
    with a browser user-agent (the earlier F5 WAF rejections were a client
    fingerprint artefact, not evidence). Every /.well-known/ path, /openapi.json,
    /openapi.yaml, /swagger.json, /api-docs, /graphql and /llms.txt returned HTTP
    200 with a redirect to the /siteinfo/404.html soft-404 page on both web hosts.
    No GraphQL surface existed to introspect and no MCP endpoint existed to POST
    tools/list to. The finding of no machine-readable contract STANDS, with one
    correction: api.bchydro.com resolves and serves a valid BC Hydro certificate
    over TLS 1.3 while returning nothing to anonymous callers.
  artifactsWritten:
  - authentication/bc-hydro-authentication.yml
  - conventions/bc-hydro-conventions.yml
  - conformance/bc-hydro-conformance.yml
  - lifecycle/bc-hydro-lifecycle.yml
  - packages/bc-hydro-packages.yml
  - well-known/bc-hydro-well-known.yml
  - security/bc-hydro-domain-security.yml
  - json-schema/bc-hydro-outages-map.json
  - examples/bc-hydro-outages-map-example.json
  - llms/bc-hydro-llms.txt
  artifactsNotWritten:
    reason_no_spec_to_ground_them_in:
    - openapi/
    - overlays/
    - errors/
    - scopes/
    - data-model/
    - skills/
    - mcp/
    - grpc/
    - arazzo/
    reason_provider_publishes_none:
    - asyncapi/ (no event, webhook or streaming surface)
    - sandbox/ (no test environment, credentials or fixtures)
    - cli/ (no first-party CLI)
    - components/ (no embeddable UI components)
    - changelog/ (no dated API changelog)
    - errors/decline-codes (not a payments provider)
    - rate-limits/ (no published limits)
    - plans/ (no API pricing — electricity tariffs only)
  pointersDeliberatelyNotEmitted:
    StatusPage: >-
      The outage map is a consumer electricity-outage surface, not an API status
      page; wiring StatusPage would misrepresent it.
    Deprecation: No deprecation or sunset policy exists.
    SDKs: No first-party client library exists in any registry.
    WellKnown: The well-known probe index records only misses; nothing was found.
    Idempotency: Both data surfaces are read-only with no idempotency contract.
    SignUp: There is no developer signup — only a utility customer account.
    ChangeLog: No API changelog is published.
  pointersAdded:
  - Authentication (artifact)
  - Conventions
  - Conformance
  - Lifecycle
  - Packages
  - JSONSchema
  - LLMsTxt
  - DomainSecurity
  - Compliance (NERC CIP-013-2 supplier cybersecurity programme)
  - Support
  - HelpCenter
  - TermsOfService
  - Accessibility
  - News
  - Tariff
  - OpenData
  identityFixes:
  - >-
    apis.yml image: was pointing at an unrelated Groq icon
    (kinlane-images .../icons/groq.png). Replaced with BC Hydro's own header logo
    SVG (HTTP 200, image/svg+xml).
