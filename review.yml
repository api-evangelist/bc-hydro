findings:
  summary: >-
    BC Hydro is the unmandated end of the Canadian energy data spectrum and it
    shows. It is a provincial Crown corporation and monopoly retailer, rate-
    regulated by the BCUC, and no consumer data right binds it — Ontario Reg
    633/21 stops at Ontario's border and Canada has no federal energy
    equivalent. BC Hydro nonetheless supports Green Button voluntarily, but
    only the Download My Data file half: the customer signs into MyHydro and
    downloads a CSV or Green Button XML file of their own metered use. There is
    no Connect My Data, no OAuth surface, no third-party onboarding, no base
    URI, and no certification, so no third party can reach a customer's data
    programmatically. On the other axis there is no developer subdomain, no
    /developers or /api path, no OpenAPI or Swagger anywhere in a 3,703-URL
    sitemap, and no open data portal; wholesale transmission information sits
    behind a registration-only OATI OASIS node and BCUC-ordered postings are
    documents. The only genuinely open artifacts are one 2013 mapping layer in
    the provincial BC Data Catalogue and an undocumented outage-map JSON feed
    that BC Hydro never claims as an API. Zero machine-readable API contracts
    were harvested.
  apisListed: 0
  developerPortal: null
  openapiHarvested: false
  specsCount: 0
  gated: true
  contrast: >-
    Against Hydro One, profiled the same day: an Ontario distributor is
    compelled by regulation to run a live Green Button CMD OAuth 2.0
    authorization surface with a published vendor onboarding form and terms and
    conditions, however privately its base URI is issued. BC Hydro, larger and
    unmandated, offers the same standard's file format and nothing a developer
    can call. The mandate is the difference, and it is a province-level one.

