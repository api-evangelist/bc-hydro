      commercial, not published as an API.
  - url: https://www.bchydro.com/power-outages/app/outages-map-data.json
    status: 200
    note: >-
      Undocumented JSON array of live outages, application/json, 26,749 bytes,
      18 records, parsed successfully. Anonymous but undocumented and
      unlicensed — recorded here, deliberately NOT listed as an API. Refetched in
      the enrichment round 2026-07-27: still HTTP 200, 39,920 bytes, 28 records,
      same 22-field shape. A JSON Schema was DERIVED from that live response and
      saved to json-schema/bc-hydro-outages-map.json (with a two-record sample in
      examples/), clearly labelled as an API Evangelist derivation, not a BC Hydro
      contract. It remains unlisted in apis[].
  - url: https://www.bchydro.com/power-outages/app/get-outages.json
    status: 404
    note: Hard 404.
  - url: https://www.bchydro.com/power-outages/app/outage-map-data.json
    status: 404
    note: Hard 404.
  - url: https://catalogue.data.gov.bc.ca/api/3/action/organization_list?q=hydro
    status: 200
    note: Returns ["bc-hydro-and-power-authority"] — BC Hydro is a publisher org in the provincial CKAN catalogue.
  - url: https://catalogue.data.gov.bc.ca/api/3/action/package_search?fq=organization:bc-hydro-and-power-authority&rows=100
    status: 200
    note: >-
      count = 1. Only "BC Hydro Resource Options Mapping - 2013," exposed as an
      OGC WMS GetCapabilities service and a KML loader on openmaps.gov.bc.ca.
  - url: https://www.greenbuttonalliance.org/certification
    status: 200
    note: >-
      Describes the GBA Connect My Data and Download My Data testing programs.
      No certified-utility list on the page; BC Hydro not named; only Canadian
      organization named is Enbridge Gas as a GBA Sponsor Member.
  - url: https://www.bcuc.com/
    status: 200
    note: Regulator. Economic regulation of BC Hydro; no energy data mandate.
  - url: https://github.com/bchydro
    status: 404
    note: No BC Hydro GitHub organization at the obvious handle.
  - url: https://www.linkedin.com/company/bc-hydro
