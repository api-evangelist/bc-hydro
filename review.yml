aid: bc-hydro
name: BC Hydro
review:
  question: >-
    Does BC Hydro publish a documented public API — either a mandated consumer
    energy data API (Green Button / Consumer Data Right style) or an open
    grid/market data API?
  answer: false
  date: '2026-07-27'
  reviewer: API Evangelist
  method: >-
    Anonymous HTTP probing of bchydro.com and app.bchydro.com, subdomain
    resolution, sitemap.xml enumeration (3,703 URLs), CKAN queries against the
    BC Data Catalogue, and reading of BC Hydro's own billing, load-data,
    transmission-scheduling and EV public-charging pages. No credentials were
    used and no customer account was created.

energyDataPosture:
  homeMarket: Canada — British Columbia
  tier: utility-retailer (vertically integrated provincial Crown corporation — generation, transmission, distribution and monopoly retail in one entity)
  regulator: B.C. Utilities Commission (BCUC) — https://www.bcuc.com/ (200) — economic/rate regulation only, no data-sharing obligation
  mandateRegime: green-button-voluntary
  mandateStatus: voluntary-adopted
  mandateVerbatim: >-
    No consumer energy data mandate applies to BC Hydro. Ontario Regulation
    633/21 (Energy Data, under the Electricity Act, 1998) compels Ontario
    electricity and natural gas distributors to implement Green Button Download
    My Data and Connect My Data and to be certified by the Green Button
    Alliance — it binds Ontario distributors only and has no force in British
    Columbia. Australia's Consumer Data Right energy sector does not apply.
    Canada has no federal energy consumer data right; the federal
    Consumer-Driven Banking Act covers banking, not energy. British Columbia
    has enacted no equivalent regulation. BC Hydro's Green Button support is
    therefore VOLUNTARY, not mandated.
  mandateEvidence:
    verified:
      - >-
        BC Hydro's own billing page at
        https://app.bchydro.com/accounts-billing/bill-payment/view-bill.html
        (HTTP 200, fetched 2026-07-27) states under "Electricity use history"
        that a customer can "Download a CSV or Green Button XML file with your
        metered electricity use," that data is "available through the previous
        day," and that up to three years of history is retained. This is
        first-party evidence of Green Button Download My Data (DMD) in the
        file-export sense.
    notVerified:
      - >-
        No Green Button Alliance certification for BC Hydro was found.
        https://www.greenbuttonalliance.org/certification (HTTP 200) describes
        the DMD and CMD testing programs but publishes no list of certified
        utilities on that page; the only Canadian organization named there is
        Enbridge Gas, as a GBA Sponsor Member.
      - >-
        No ESPI/Green Button version, schema reference, or conformance claim is
        published anywhere on bchydro.com.
      - >-
        The XML file itself could not be inspected — it is emitted only inside
        an authenticated MyHydro session, and no account was used.
  mandateStatusReasoning: >-
    Recorded as voluntary-adopted, NOT live-implemented. BC Hydro adopted the
    Green Button file format without any obligation to do so, and says so on
    its own site — but a downloadable XML file behind a customer login is not a
    standards-conformant API surface. No base URI, no OAuth authorization
    endpoint, no register entry, and no certification could be found, so the
    stricter live-implemented grade is not earned. Equally, this is not a mere
    compliance claim: the DMD export is documented by BC Hydro itself, so it is
    not downgraded to live-claimed-unverified for the file half.

  dataStandard: Green Button / ESPI (Download My Data file export only; no version or conformance level published). No Connect My Data. No CDR Consumer Data Standards, OCPP, OCPI, OpenADR, IEEE 2030.5, or IEC CIM reference found anywhere on the site.

  consumerDataApi:
    available: false
    detail: >-
      A third party cannot obtain an individual BC Hydro customer's usage or
      billing data through any documented API. The only route to that data is
      the account holder personally signing in to MyHydro and downloading a CSV
      or Green Button XML file. There is no Green Button Connect My Data, no
      OAuth 2.0 authorization surface, no third-party vendor registration form,
      no terms and conditions for data recipients, and no published resource
      base URI. Bulk/large-customer load data
      (https://app.bchydro.com/accounts-billing/rates-energy-use/access-load-data.html,
      HTTP 200) is delivered as reports in response to a manual request form,
      with BC Hydro reserving the right to demand "authentication questions or
      proof" of authorization; data is described as kWh in "one-hour intervals"
      with no API, feed, or machine-readable delivery mentioned.
  marketDataOpen:
    available: false
    detail: >-
      BC Hydro publishes no open data portal and no documented public grid,
      system, or market data API. Wholesale transmission information goes to an
      OATI-hosted OASIS node which
      https://www.bchydro.com/energy-in-bc/operations/transmission/transmission-scheduling/oasis.html
      (HTTP 200) describes as allowing "registered users to make reservations
      for transmission service on the BC Hydro transmission system"; the node
      links it names (http://www.oasis.oati.com/cwo_default.htm and
      http://www.oasis.oati.com/bpat/index.html) did not resolve anonymously
      (curl exit / HTTP 000). The BCUC-ordered postings at
      https://www.bchydro.com/energy-in-bc/operations/transmission/transmission-scheduling/transaction-data.html
      (HTTP 200) — economic test results posted daily, Network Economy and
      Non-Firm utilization reports posted weekly, "Pursuant to B.C. Utilities
      Commission Order Number G-127-06" — are documents, with no format, feed,
      or API disclosed.
    nuanceRecorded:
      - >-
        BC Data Catalogue (CKAN) organization "bc-hydro-and-power-authority"
        exists and holds exactly ONE dataset: "BC Hydro Resource Options
        Mapping - 2013," reachable anonymously via an OGC WMS GetCapabilities
        service and a KML loader on openmaps.gov.bc.ca. Real open data, but a
        2013 planning map layer, not grid or market data.
      - >-
        An UNDOCUMENTED JSON feed backing the public outage map was found at
        https://www.bchydro.com/power-outages/app/outages-map-data.json
        (HTTP 200, application/json, 26,749 bytes on 2026-07-27, parsed as a
        JSON array of 18 outage objects carrying id, gisId, regionId,
        municipality, area, cause, numCustomersOut, crewStatus, dateOff,
        dateOn, lastUpdated, latitude, longitude and an outage polygon). It is
        anonymous and machine-readable but is nowhere documented, licensed, or
        referenced as an API by BC Hydro, so it is NOT listed in apis.yml.
    split: >-
      The split is that there is barely a split — BC Hydro is closed on both
      axes. Consumer data is real, standards-shaped, and reachable only by the
      customer in person; market data is registration-gated (OASIS) or
      published as documents. This is the unmandated Crown-monopoly opposite of
      an Ontario distributor like Hydro One, which is compelled by Ontario Reg
      633/21 to stand up a live Green Button CMD OAuth surface for third
      parties.

  accessGate: customer-account-required
  accessGateDetail: >-
    There is nothing for a developer to sign up for. To reach any BC Hydro
    energy data a person must (1) be a BC Hydro account holder, (2) register
    for a MyHydro account, (3) sign in at https://www.bchydro.com/login, and
    (4) manually download their own CSV or Green Button XML file from the
    billing/consumption pages. Large or multi-unit customers may additionally
    submit a peak-load-data request form and receive a report. No API key, no
    OAuth client registration, no accreditation path, no partner program, and
    no data licence agreement is published.
  authModel: >-
    Customer-portal session SSO only. https://www.bchydro.com/login (HTTP 200)
    redirects to a ForgeRock/OpenAM-style endpoint at
    https://app.bchydro.com/sso/UI/Login?goto=...&realm=bch-ps carrying a nonce
    and a realm parameter, then on to the BCHCustomerPortal. No OAuth 2.0
    authorization or token endpoint is exposed for third parties, no client
    registration exists, and no mTLS or accreditation scheme applies.
    https://app.bchydro.com/.well-known/openid-configuration was rejected by
    the site WAF (F5 "Request Rejected" interstitial) rather than served, so no
    OpenID Connect discovery document is available anonymously.

probes:
  - url: https://www.bchydro.com/
    status: 200
    note: Resolves to https://www.bchydro.com/index.html. Corporate site.
  - url: https://developer.bchydro.com/
    status: 000
    note: DNS/connection failure — no developer subdomain exists.
  - url: https://developers.bchydro.com/
    status: 000
    note: DNS/connection failure.
  - url: https://api.bchydro.com/
    status: 000
    note: >-
      CORRECTED 2026-07-27 (enrichment round): this is not a DNS failure. The host
      RESOLVES to 142.52.192.219 (ARIN NetName BCHYDRO, OrgName "B.C. Hydro") and
      completes a TLS 1.3 handshake presenting a valid Entrust OV certificate —
      C=CA, ST=British Columbia, O=British Columbia Hydro and Power Authority,
      CN=*.bchydro.com, valid 2025-09-23 to 2026-10-24. TLS 1.2 is refused with
      handshake_failure (alert 40), no ALPN is negotiated, no client certificate
      is requested, and the connection is closed with no HTTP response for /,
      /openapi.json, /swagger.json, /api-docs, /v1, /health, /graphql and
      /.well-known/openid-configuration. Port 80 times out. A BC Hydro-owned API
      host therefore EXISTS but serves nothing anonymously and is documented
      nowhere — it remains deliberately unlisted in apis[].
  - url: https://docs.bchydro.com/
    status: 000
    note: DNS/connection failure.
  - url: https://data.bchydro.com/
    status: 000
    note: DNS/connection failure.
  - url: https://www.bchydro.com/developers
    status: 200
    note: Soft 404 — redirects to https://www.bchydro.com/siteinfo/404.html.
  - url: https://www.bchydro.com/api
    status: 200
    note: Soft 404 — redirects to /siteinfo/404.html.
  - url: https://www.bchydro.com/data
    status: 200
    note: Soft 404 — redirects to /siteinfo/404.html.
  - url: https://www.bchydro.com/openapi.json
    status: 200
    note: Soft 404 — redirects to /siteinfo/404.html. No OpenAPI.
  - url: https://www.bchydro.com/swagger.json
    status: 200
    note: Soft 404 — redirects to /siteinfo/404.html. No Swagger.
  - url: https://www.bchydro.com/.well-known/openid-configuration
    status: 200
    note: Soft 404 — redirects to /siteinfo/404.html.
  - url: https://www.bchydro.com/api-docs
    status: 200
    note: Body is the F5 WAF "Request Rejected" interstitial, not a document.
  - url: https://www.bchydro.com/.well-known/security.txt
    status: 200
    note: Body is the F5 WAF "Request Rejected" interstitial. No security.txt served.
  - url: https://app.bchydro.com/.well-known/openid-configuration
    status: 200
