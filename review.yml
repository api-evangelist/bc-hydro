  - url: https://pypi.org/project/bchydro/
    status: 200
    note: >-
      Community Python package "bchydro" 0.8.1 (MIT, Eric McNiece,
      github.com/emcniece/bchydro) described as "BCHydro API". THIRD PARTY, not
