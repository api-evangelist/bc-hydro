      layout, the customer SSO path /sso/UI/Login, /sap/* and /bctc/* — and no API,
      developer or open-data path. The sitemap directive is commented out.
  - url: https://www.bchydro.com/work-with-us/suppliers/doing-business-with-bchydro/contractor-cybersecurity.html
    status: 200
    note: >-
      Found in the enrichment round. "As directed by the B.C. Utilities Commission
      and the North American Electric Reliability Corporation (NERC), we've
      developed cybersecurity policies and procedures for suppliers specific to
      NERC's Critical Infrastructure Protection standard 013 (CIP-013-2)", with two
      published PDFs (NERC CIP requirements digest for BC Hydro suppliers, 509 KB;
