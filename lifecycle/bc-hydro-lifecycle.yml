note: >-
  BC Hydro publishes no API versioning policy, no deprecation policy, no API SLA,
  no API changelog and no API status page — because it publishes no API. What it
  does publish is a regulated utility lifecycle: BCUC-approved tariffs, terms and
  conditions of service, and a consumer outage map for the electricity service
  itself. Those are recorded here so the absence is explicit, not implied.
