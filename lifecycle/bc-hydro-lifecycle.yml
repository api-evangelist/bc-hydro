  docs: null
  note: >-
    Neither the Green Button / CSV export nor the undocumented outage-map JSON
    feed carries a version, and no ESPI version is published.
deprecation:
  policy_url: null
  sunset_header: false
  note: >-
    No deprecation or sunset policy exists for any data surface. The outage-map
    JSON feed is undocumented, so it can change or be withdrawn with no notice at
    all. No `Deprecation` pointer is emitted.
sla:
  url: null
  uptime_target: null
  note: >-
    No API SLA. Service reliability for electricity supply is regulated by the
    BCUC under the electric tariff, which is a different thing entirely.
status_page: null
status_page_note: >-
  No API or platform status page exists. https://www.bchydro.com/power-outages/app/outage-map.html
  (HTTP 200) is a consumer electricity-outage map — the operational status of the
  power system, not of a developer platform — and its backing JSON feed is
  undocumented. Emitting a `StatusPage` pointer for it would misrepresent an
  outage map as an API status surface, so none is wired.
